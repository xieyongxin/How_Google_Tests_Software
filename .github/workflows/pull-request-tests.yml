name: PR 受影响测试

on:
  pull_request:

permissions:
  contents: read

jobs:
  affected-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行执行器自测
        run: python -m unittest discover -s tools/test-platform -p 'test_*.py'
      - name: 运行受影响测试
        run: python tools/test-platform/run_tests.py --affected --base origin/${{ github.base_ref }} --isolation
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-platform-reports
          path: target/test-platform-reports/
